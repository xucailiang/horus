name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.11"
          python-version: "3.12"
          enable-cache: true
      - name: Install frozen dependencies
        run: uv sync --python 3.12 --frozen --extra mcp --group dev
      - name: Lint and type check
        run: |
          uv run --frozen ruff check src tests scripts
          uv run --frozen mypy src
      - name: Install verified HTTP engines
        run: uv run --frozen python scripts/install_engines.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Run unit and real-engine integration tests
        run: uv run --frozen pytest -q --junitxml=test-results/junit.xml
      - name: Build distributions
        run: uv build
      - name: Verify base-wheel replay without MCP or a model
        run: uv run --frozen python -m tests.acceptance.verify_wheel
      - name: Audit pinned runtime dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          uv export --frozen --all-extras --no-dev --no-emit-project --quiet --output-file "$RUNNER_TEMP/horus-requirements.txt"
          uvx --from pip-audit==2.10.1 pip-audit --no-deps --disable-pip --progress-spinner off --strict -r "$RUNNER_TEMP/horus-requirements.txt"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
