[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "horus"
version = "0.1.0a1"
description = "Agent-planned, human-reviewed, deterministic API testing"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.12",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Natural Language :: English",
  "Natural Language :: Chinese (Simplified)",
]
dependencies = [
  "pydantic==2.14.1",
  "typer==0.27.3",
  "PyYAML==6.0.3",
  "jsonschema==4.26.0",
  "openapi-spec-validator==0.9.0",
  "openapi-schema-validator==0.9.0",
  "regress==2026.9.1",
]

[project.optional-dependencies]
mcp = ["fastmcp-slim[server]==4.1.0"]

[project.urls]
Homepage = "https://github.com/xucailiang/horus"
Repository = "https://github.com/xucailiang/horus"
Issues = "https://github.com/xucailiang/horus/issues"

[dependency-groups]
dev = [
  "fastmcp-slim[client]==4.1.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.17.0",
  "mypy==2.4.0",
  "types-PyYAML",
  "types-jsonschema",
]

[project.scripts]
horus = "horus.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/horus"]

[tool.hatch.build.targets.wheel.force-include]
"skills/horus" = "horus/skill"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["agent: real host and human acceptance"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

